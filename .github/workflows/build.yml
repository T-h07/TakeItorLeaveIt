name: build

on:
  push:
    branches: [develop, "feature/**"]
  pull_request:
    branches: [develop, release, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Windows runner: matches the development environment and builds the net472 (Mono) target natively.
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-11-24)

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4 (pinned 2026-11-24)
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TakeItOrLeaveIt.sln

      # Everything builds from redistributable NuGet packages (LavaGang.MelonLoader 0.7.3 + HarmonyX).
      # No proprietary Schedule I assemblies are needed or used in CI.
      - name: Build (Release, warnings as errors)
        run: dotnet build TakeItOrLeaveIt.sln -c Release --no-restore

      - name: Test (game-independent)
        run: dotnet test TakeItOrLeaveIt.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory artifacts/test-results

      - name: Package mod DLLs
        shell: pwsh
        run: ./tools/Package-Mod.ps1 -Configuration Release -NoBuild

      - name: Upload mod package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned 2026-11-24)
        with:
          name: TakeItOrLeaveIt-CI-no-game-hooks-${{ github.sha }}
          path: artifacts/package
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned 2026-11-24)
        with:
          name: test-results-${{ github.sha }}
          path: artifacts/test-results
          if-no-files-found: ignore
